<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        position: relative;
      }
      .userModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        flex-direction: column;
        gap: 1rem;
      }

      .userModal h2 {
        color: #fff;
        font-size: 1.5rem;
        margin: 0;
      }

      .userModal input {
        width: 80%;
        max-width: 300px;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 999px;
        font-size: 1rem;
        text-align: center;
      }

      .userModal input:focus {
        outline: 2px solid #38bdf8;
        background: #fff;
      }

      .userModal button {
        background: linear-gradient(45deg, #6366f1, #9333ea);
        color: white;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 2rem;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .userModal button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #9333ea66;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .userModal button.loading {
        color: transparent;
        position: relative;
        cursor: wait;
      }

      .userModal button.loading::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -12px;
        margin-left: -12px;

        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 255, 255, 0.5);
        border-top-color: #fff;
        border-radius: 50%;

        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <form class="userModal">
      <h2>Se identifique, usuário!</h2>
      <input type="text" id="username" placeholder="Digite seu nome" />
      <button type="submit" id="submitButton">Entrar</button>
    </form>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input
        id="input"
        autocomplete="off"
        placeholder="Digite sua mensagem"
      /><button>Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io({
        auth: {
          serverOffset: 0,
        },
        autoConnect: false,
      });

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const userModal = document.querySelector(".userModal");
      const usernameInput = document.getElementById("username");

      const submitButton = document.getElementById("submitButton");

      userModal.addEventListener("submit", (e) => {
        e.preventDefault();
        if (usernameInput.value) {
          submitButton.disabled = true;
          submitButton.classList.add("loading");

          fetch("/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name: usernameInput.value }),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data?.id) {
                localStorage.setItem("user", data.id);
                localStorage.setItem("username", usernameInput.value);
                userModal.style.display = "none";
                socket.connect();
              }
            })
            .catch((error) => console.error("Erro ao registrar:", error))

            .finally(() => {
              submitButton.disabled = false;
              submitButton.classList.remove("loading");
            });
        }
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          socket.emit(
            "chat message",
            input.value,
            localStorage.getItem("user")
          );
          input.value = "";
        }
      });

      socket.on("chat message", (msg, username, serverOffset) => {
        const item = document.createElement("li");
        item.textContent = `${username}: ${msg}`;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        socket.auth.serverOffset = serverOffset;
      });
    </script>
  </body>
</html>
